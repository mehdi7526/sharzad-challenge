services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:4000}
        NEXT_PUBLIC_API_USE_PROXY: ${NEXT_PUBLIC_API_USE_PROXY:-false}
    network_mode: service:backend
    depends_on:
      - backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '3000:3000'
      - '4000:4000'
    environment:
      BACKEND_CORS_ORIGIN: ${BACKEND_CORS_ORIGIN:-http://localhost:3000}
      BACKEND_HOME_SCENARIO: ${BACKEND_HOME_SCENARIO:-normal}
      BACKEND_VIEWER_SCENARIO: ${BACKEND_VIEWER_SCENARIO:-normal}
